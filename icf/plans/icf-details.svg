<line class="dim" x1="-310.0" y1="430.0" x2="-250.0" y2="370.0"/>
<line class="dim" x1="-310.0" y1="780.0" x2="-250.0" y2="720.0"/>
<text class="dimt" x="-324.0" y="575.0" text-anchor="middle" transform="rotate(-90.0 -324.0 575.0)">350</text>
<text class="code" x="2260.0" y="280.0" text-anchor="start">Д2 · РЪБ НА ОТВОР — ПЛАН</text>
<rect class="wall" x="2260.0" y="400.0" width="950.0" height="350.0"/>
<line class="wall-l" x1="3210.0" y1="280.0" x2="3210.0" y2="870.0"/>
<text class="lbl-s" x="2260.0" y="1030.0" text-anchor="start">стена</text>
<text class="lbl-s" x="3310.0" y="615.0" text-anchor="start">отвор →</text>
<text class="lbl-s" x="2260.0" y="1270.0" text-anchor="start">затварящ блок / челен капак</text>
<text class="lbl-s" x="2260.0" y="1430.0" text-anchor="start">по системата на доставчика</text>
<text class="code" x="0.0" y="2510.0" text-anchor="start">Д3 · ПРЕГРАДА КЪМ ICF СТЕНА — ПЛАН</text>
<rect class="wall" x="0.0" y="2630.0" width="1300.0" height="350.0"/>
<line class="part" x1="550.0" y1="2980.0" x2="550.0" y2="3580.0"/>
<line class="part" x1="670.0" y1="2980.0" x2="670.0" y2="3580.0"/>
<line class="part" x1="550.0" y1="3580.0" x2="670.0" y2="3580.0"/>
<text class="lbl-s" x="610.0" y="3780.0" text-anchor="start">преграда 120 mm</text>
<text class="lbl-s" x="0.0" y="4100.0" text-anchor="start">не прекъсва ядрото и не носи покрива</text>
<text class="code" x="2260.0" y="2510.0" text-anchor="start">Д4 · НАДГРЕДА НАД ОТВОР — РАЗРЕЗ</text>
<rect class="wall" x="2260.0" y="2630.0" width="350.0" height="550.0"/>
<line class="hidden" x1="2260.0" y1="3180.0" x2="2260.0" y2="4030.0"/>
<line class="hidden" x1="2610.0" y1="3180.0" x2="2610.0" y2="4030.0"/>
