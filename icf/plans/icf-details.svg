<text class="lbl-s" x="2435.0" y="3610.0" text-anchor="middle" transform="rotate(-90.0 2435.0 3610.0)">отвор</text>
<text class="lbl-s" x="2730.0" y="3250.0" text-anchor="start">надгреда по</text>
<text class="lbl-s" x="2730.0" y="3430.0" text-anchor="start">конструктивен</text>
<text class="lbl-s" x="2730.0" y="3610.0" text-anchor="start">проект</text>
<line class="dim" x1="1980.0" y1="2630.0" x2="1980.0" y2="3180.0"/>
<line class="dim" x1="1950.0" y1="2660.0" x2="2010.0" y2="2600.0"/>
<line class="dim" x1="1950.0" y1="3210.0" x2="2010.0" y2="3150.0"/>
<text class="dimt" x="1936.0" y="2905.0" text-anchor="middle" transform="rotate(-90.0 1936.0 2905.0)">≥550</text>
<text class="sub" x="0.0" y="4870.0" text-anchor="start">БЕЛЕЖКИ</text>
<text class="note" x="0.0" y="5190.0" text-anchor="start">1. Дебелината 350 mm е работно допускане — уточнява се по избраната ICF система (250–400 mm).</text>
<text class="note" x="0.0" y="5410.0" text-anchor="start">2. Армировката и класът бетон се определят от конструктор, не от доставчика на панелите.</text>
<text class="note" x="0.0" y="5630.0" text-anchor="start">3. Отворите се оформят в кофража — не се изрязват след бетониране.</text>
<text class="note" x="0.0" y="5850.0" text-anchor="start">4. Надгредата над плъзгащата врата O3 (2800 mm) е задължителна — да влезе в офертата.</text>
<text class="note" x="0.0" y="6070.0" text-anchor="start">5. Размери в mm. Детайлите са схематични, не са работни чертежи.</text>
<rect class="tb" x="-320.0" y="6230.0" width="6080.0" height="968.0"/>
