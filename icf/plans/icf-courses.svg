<text class="note" x="0.0" y="4440.0" text-anchor="start">1. Модулът 0,50 × 0,25 m е примерен — реалният се дава от доставчика.</text>
<text class="note" x="0.0" y="4660.0" text-anchor="start">2. Броят блокове зависи от модула и от разположението на отворите.</text>
<text class="note" x="0.0" y="4880.0" text-anchor="start">3. Да се посочи процент отпадък от рязане.</text>
<text class="note" x="0.0" y="5100.0" text-anchor="start">4. Ъглите и Т-възлите се решават с елементи от системата.</text>
<text class="note" x="0.0" y="5320.0" text-anchor="start">5. Реденето започва от ъгъл.</text>
