<rect class="el" x="164.0" y="49.0" width="34.0" height="15.0"/>
<text class="note" x="181.0" y="55.5" text-anchor="middle">ДЗТ 2</text>
<text class="lbl-s" x="181.0" y="61.5" text-anchor="middle">40 A / 30 mA</text>
