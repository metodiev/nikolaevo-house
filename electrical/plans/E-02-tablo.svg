<line class="el-d" x1="158.0" y1="56.5" x2="164.0" y2="56.5"/>
<line class="wall-l" x1="12.0" y1="66.0" x2="198.0" y2="66.0"/>
<text class="lbl-s" x="13.5" y="71.0" text-anchor="start">№</text>
<text class="lbl-s" x="21.5" y="71.0" text-anchor="start">кръг</text>
<text class="lbl-s" x="129.5" y="71.0" text-anchor="start">защита</text>
<text class="lbl-s" x="151.5" y="71.0" text-anchor="start">кабел</text>
<text class="lbl-s" x="175.5" y="71.0" text-anchor="start">ДЗТ</text>
<line class="wall-l" x1="12.0" y1="73.0" x2="198.0" y2="73.0"/>
<text class="note" x="13.5" y="79.0" text-anchor="start">C1</text>
<text class="note" x="21.5" y="79.0" text-anchor="start">Осветление — спални, баня, мокро</text>
<text class="note" x="129.5" y="79.0" text-anchor="start">10 A</text>
<text class="note" x="151.5" y="79.0" text-anchor="start">1,5 mm²</text>
<text class="note" x="175.5" y="79.0" text-anchor="start">ДЗТ 1</text>
<line class="dim" x1="12.0" y1="82.4" x2="198.0" y2="82.4"/>
<text class="note" x="13.5" y="88.4" text-anchor="start">C2</text>
<text class="note" x="21.5" y="88.4" text-anchor="start">Осветление — хол, кухня, антре, вън</text>
<text class="note" x="129.5" y="88.4" text-anchor="start">10 A</text>
<text class="note" x="151.5" y="88.4" text-anchor="start">1,5 mm²</text>
<text class="note" x="175.5" y="88.4" text-anchor="start">ДЗТ 1</text>
<line class="dim" x1="12.0" y1="91.8" x2="198.0" y2="91.8"/>
<text class="note" x="13.5" y="97.8" text-anchor="start">C3</text>
<text class="note" x="21.5" y="97.8" text-anchor="start">Контакти — хол и трапезария</text>
<text class="note" x="129.5" y="97.8" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="97.8" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="97.8" text-anchor="start">ДЗТ 1</text>
<line class="dim" x1="12.0" y1="101.2" x2="198.0" y2="101.2"/>
<text class="note" x="13.5" y="107.2" text-anchor="start">C4</text>
<text class="note" x="21.5" y="107.2" text-anchor="start">Контакти — кухня (плот)</text>
<text class="note" x="129.5" y="107.2" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="107.2" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="107.2" text-anchor="start">ДЗТ 1</text>
<line class="dim" x1="12.0" y1="110.6" x2="198.0" y2="110.6"/>
<text class="note" x="13.5" y="116.6" text-anchor="start">C5</text>
<text class="note" x="21.5" y="116.6" text-anchor="start">Кухня — фурна и котлони</text>
<text class="note" x="129.5" y="116.6" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="116.6" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="116.6" text-anchor="start">ДЗТ 1</text>
<line class="dim" x1="12.0" y1="120.0" x2="198.0" y2="120.0"/>
<text class="note" x="13.5" y="126.0" text-anchor="start">C6</text>
<text class="note" x="21.5" y="126.0" text-anchor="start">Контакти — спални</text>
<text class="note" x="129.5" y="126.0" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="126.0" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="126.0" text-anchor="start">ДЗТ 1</text>
<line class="dim" x1="12.0" y1="129.4" x2="198.0" y2="129.4"/>
<text class="note" x="13.5" y="135.4" text-anchor="start">C7</text>
<text class="note" x="21.5" y="135.4" text-anchor="start">Баня + мокро (пералня, сушилня)</text>
<text class="note" x="129.5" y="135.4" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="135.4" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="135.4" text-anchor="start">ДЗТ 2</text>
<line class="dim" x1="12.0" y1="138.8" x2="198.0" y2="138.8"/>
<text class="note" x="13.5" y="144.8" text-anchor="start">C8</text>
<text class="note" x="21.5" y="144.8" text-anchor="start">Бойлер / термопомпа</text>
<text class="note" x="129.5" y="144.8" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="144.8" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="144.8" text-anchor="start">ДЗТ 2</text>
<line class="dim" x1="12.0" y1="148.2" x2="198.0" y2="148.2"/>
<text class="note" x="13.5" y="154.2" text-anchor="start">C9</text>
<text class="note" x="21.5" y="154.2" text-anchor="start">Вентилация с рекуперация</text>
<text class="note" x="129.5" y="154.2" text-anchor="start">10 A</text>
<text class="note" x="151.5" y="154.2" text-anchor="start">1,5 mm²</text>
<text class="note" x="175.5" y="154.2" text-anchor="start">ДЗТ 2</text>
<line class="dim" x1="12.0" y1="157.6" x2="198.0" y2="157.6"/>
<text class="note" x="13.5" y="163.6" text-anchor="start">C10</text>
<text class="note" x="21.5" y="163.6" text-anchor="start">Външни контакти и осветление</text>
<text class="note" x="129.5" y="163.6" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="163.6" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="163.6" text-anchor="start">ДЗТ 2</text>
<line class="dim" x1="12.0" y1="167.0" x2="198.0" y2="167.0"/>
<text class="note" x="13.5" y="173.0" text-anchor="start">C11</text>
<text class="note" x="21.5" y="173.0" text-anchor="start">Резерв</text>
<text class="note" x="129.5" y="173.0" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="173.0" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="173.0" text-anchor="start">ДЗТ 2</text>
<line class="dim" x1="12.0" y1="176.4" x2="198.0" y2="176.4"/>
<text class="note" x="13.5" y="182.4" text-anchor="start">C12</text>
<text class="note" x="21.5" y="182.4" text-anchor="start">Резерв</text>
<text class="note" x="129.5" y="182.4" text-anchor="start">16 A</text>
<text class="note" x="151.5" y="182.4" text-anchor="start">2,5 mm²</text>
<text class="note" x="175.5" y="182.4" text-anchor="start">ДЗТ 2</text>
<line class="dim" x1="12.0" y1="185.8" x2="198.0" y2="185.8"/>
<text class="sub" x="12.0" y="195.8" text-anchor="start">БЕЛЕЖКИ</text>
<text class="note" x="12.0" y="202.8" text-anchor="start">1. Схемата е концептуална. Оразмеряването на кабелите, защитите и</text>
<text class="note" x="12.0" y="207.8" text-anchor="start">    селективността се прави от лицензиран проектант по действащите норми.</text>
<text class="note" x="12.0" y="212.8" text-anchor="start">2. ДЗТ 2 обхваща мокрите помещения и външните консуматори (30 mA).</text>
<text class="note" x="12.0" y="217.8" text-anchor="start">3. Кухнята (котлони, фурна) е на отделен кръг — не се комбинира с контактите.</text>
<text class="note" x="12.0" y="222.8" text-anchor="start">4. Таблото е в антрето, на южната стена до вратата, на височина 1400–1800 mm.</text>
<text class="note" x="12.0" y="227.8" text-anchor="start">5. Свободните места в таблото се предвиждат за резервни кръгове.</text>
<rect class="tb" x="12.0" y="233.8" width="186.0" height="24.2"/>
<line class="tb" x1="12.0" y1="241.8" x2="198.0" y2="241.8"/>
<line class="tb" x1="12.0" y1="248.8" x2="198.0" y2="248.8"/>
<line class="tb" x1="146.0" y1="233.8" x2="146.0" y2="248.8"/>
<text class="tbmain" x="15.0" y="238.7" text-anchor="start" style="font-size:2.6px">NIKOLAEVO HOUSE — ЕЛЕКТРОИНСТАЛАЦИЯ</text>
<text class="tbsub" x="15.0" y="246.6" text-anchor="start">Едносхемна схема на таблото · лист E-02</text>
<text class="tbsmall" x="149.0" y="238.9" text-anchor="start">E-02</text>
<text class="tbsmall" x="149.0" y="246.6" text-anchor="start">Без мащаб</text>
<text class="tbsmall" x="15.0" y="252.8" text-anchor="start">Концепция — не е работна схема. Подлежи на съгласуване с ЕРП и проектант.</text>
</svg>