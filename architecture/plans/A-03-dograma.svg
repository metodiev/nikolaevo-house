<text class="lbl-s" x="128.0" y="204.0" text-anchor="start">отваряне</text>
<line class="dim" x1="12.0" y1="205.5" x2="198.0" y2="205.5"/>
<text class="note" x="12.0" y="209.3" text-anchor="start">В2</text>
<text class="note" x="22.0" y="209.3" text-anchor="start">Антре → хол</text>
<text class="note" x="104.0" y="209.3" text-anchor="start">900 × 2100</text>
<text class="note" x="128.0" y="209.3" text-anchor="start">в хола</text>
<text class="note" x="12.0" y="214.7" text-anchor="start">В3</text>
<text class="note" x="22.0" y="214.7" text-anchor="start">Коридор → спалня 1</text>
<text class="note" x="104.0" y="214.7" text-anchor="start">900 × 2000</text>
<text class="note" x="128.0" y="214.7" text-anchor="start">в спалнята</text>
<text class="note" x="12.0" y="220.1" text-anchor="start">В4</text>
<text class="note" x="22.0" y="220.1" text-anchor="start">Коридор → спалня 2</text>
<text class="note" x="104.0" y="220.1" text-anchor="start">900 × 2000</text>
<text class="note" x="128.0" y="220.1" text-anchor="start">в спалнята</text>
<text class="note" x="12.0" y="225.5" text-anchor="start">В5</text>
<text class="note" x="22.0" y="225.5" text-anchor="start">Коридор → баня</text>
<text class="note" x="104.0" y="225.5" text-anchor="start">900 × 2000</text>
<text class="note" x="128.0" y="225.5" text-anchor="start">в банята</text>
<text class="note" x="12.0" y="230.9" text-anchor="start">В6</text>
<text class="note" x="22.0" y="230.9" text-anchor="start">Коридор → мокро</text>
<text class="note" x="104.0" y="230.9" text-anchor="start">900 × 2000</text>
<text class="note" x="128.0" y="230.9" text-anchor="start">в помещението</text>
<line class="dim" x1="12.0" y1="232.5" x2="198.0" y2="232.5"/>
<text class="sub" x="12.0" y="241.5" text-anchor="start">БЕЛЕЖКИ</text>
<text class="note" x="12.0" y="247.5" text-anchor="start">1. Триъгълникът показва страната на пантата и посоката на отваряне.</text>
<text class="note" x="12.0" y="252.5" text-anchor="start">2. Външната дограма е с троен стъклопакет; на юг с нисък коефициент на слънчева пропускливост.</text>
<text class="note" x="12.0" y="257.5" text-anchor="start">3. Южните отвори изискват външно засенчване — надвес, ролетки или пергола.</text>
<text class="note" x="12.0" y="262.5" text-anchor="start">4. Размерите са номинални (отвор в светъл размер); реалните се снемат на място.</text>
<text class="note" x="12.0" y="267.5" text-anchor="start">5. П8 е опция — да се оферира отделно.  П3 е плъзгаща, с две крила.</text>
