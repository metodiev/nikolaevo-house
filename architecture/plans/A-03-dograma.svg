<text class="sub" x="12.0" y="199.0" text-anchor="start">ВЪТРЕШНИ ВРАТИ</text>
<text class="lbl-s" x="198.0" y="199.0" text-anchor="end">0,9 m широки · отваряне в помещението</text>
<text class="lbl-s" x="12.0" y="204.0" text-anchor="start">код</text>
<text class="lbl-s" x="22.0" y="204.0" text-anchor="start">връзка</text>
