<text class="tbsub" x="15.0" y="287.3" text-anchor="start">Схема на отворите и посоките на отваряне · лист A-03</text>
<text class="tbsmall" x="149.0" y="279.6" text-anchor="start">A-03</text>
<text class="tbsmall" x="149.0" y="287.3" text-anchor="start">Схема — без мащаб</text>
<text class="tbsmall" x="15.0" y="293.5" text-anchor="start">За поръчка на дограма. Не е работен чертеж на профилите. Размери в mm.</text>
