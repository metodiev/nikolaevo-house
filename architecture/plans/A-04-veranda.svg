<text class="note" x="0.0" y="10600.0" text-anchor="start">1. Отворена веранда по цялата източна фасада — собствена конструкция, без намеса в ICF стените.</text>
<text class="note" x="0.0" y="11140.0" text-anchor="start">2. Дървена: подова скара, подпори 100 × 100 mm на ~2,0 m, парапет 1,00 m.</text>
<text class="note" x="0.0" y="11680.0" text-anchor="start">3. Собствен едноскатен покрив: 2,90 m при къщата → 2,45 m при външния ръб.</text>
<text class="note" x="0.0" y="12220.0" text-anchor="start">4. Стъпало при северния край — до входната врата В1.</text>
<text class="note" x="0.0" y="12760.0" text-anchor="start">5. Входната врата В1 и прозорците П7 и П9 са под навеса.</text>
