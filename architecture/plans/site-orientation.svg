<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900"
     font-family="Arial, Helvetica, sans-serif">
  <title>Николаево — ориентация на парцела и сградата</title>
  <desc>Схема (не е в мащаб): достъп от изток, южна ориентация на спалните и хола.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .bg     { fill:#ffffff; }
      .plot   { fill:#f2f6ee; stroke:#7d8b6a; stroke-width:2; stroke-dasharray:10 7; }
      .road   { fill:#e6e6e6; stroke:#9a9a9a; stroke-width:2; }
      .roadh  { stroke:#bcbcbc; stroke-width:2; }
      .house  { fill:#ffffff; stroke:#111111; stroke-width:3; }
      .inner  { fill:#faf8f0; stroke:#8a8a8a; stroke-width:1.5; }
      .terr   { fill:#f3e9d2; stroke:#a08a5a; stroke-width:2; stroke-dasharray:9 6; }
      .park   { fill:#eeeeee; stroke:#9a9a9a; stroke-width:2; stroke-dasharray:9 6; }
      .t      { fill:#111111; font-size:14.5px; text-anchor:middle; }
      .ts     { fill:#555555; font-size:12.5px; text-anchor:middle; }
      .tl     { fill:#3d3d3d; font-size:14px; text-anchor:middle; }
      .th     { fill:#111111; font-size:20px; font-weight:bold; text-anchor:middle; }
      .lbl    { fill:#8a6d1f; font-size:13px; text-anchor:middle; }
      .sun    { fill:#f6c22b; stroke:#c99a00; stroke-width:2; }
      .ray    { stroke:#c99a00; stroke-width:2.5; }
      .arr    { stroke:#3d6b8a; stroke-width:2.5; fill:none; }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="1300" height="900"/>

  <text class="th" x="650" y="42">ОРИЕНТАЦИЯ И ПОЛОЖЕНИЕ В ПАРЦЕЛА</text>
  <text class="ts" x="650" y="66">схема — не е в мащаб · достъп от изток · спални и хол на юг</text>

  <!-- парцел -->
  <rect class="plot" x="100" y="90" width="1050" height="670"/>

  <!-- улица / достъп -->
  <rect class="road" x="1150" y="90" width="140" height="670"/>
  <g class="roadh">
    <line x1="1150" y1="150" x2="1290" y2="150"/>
    <line x1="1150" y1="230" x2="1290" y2="230"/>
    <line x1="1150" y1="310" x2="1290" y2="310"/>
    <line x1="1150" y1="390" x2="1290" y2="390"/>
    <line x1="1150" y1="470" x2="1290" y2="470"/>
    <line x1="1150" y1="550" x2="1290" y2="550"/>
    <line x1="1150" y1="630" x2="1290" y2="630"/>
    <line x1="1150" y1="710" x2="1290" y2="710"/>
  </g>
  <text class="tl" x="1220" y="425" transform="rotate(-90 1220 425)">УЛИЦА · ДОСТЪП — ИЗТОК</text>

  <!-- сграда -->
  <rect class="house" x="250" y="170" width="700" height="480"/>
  <rect class="inner" x="250" y="170" width="700" height="140"/>
  <rect class="inner" x="250" y="310" width="700" height="60"/>
  <rect class="inner" x="250" y="370" width="330" height="280"/>
  <rect class="inner" x="580" y="370" width="190" height="280"/>
  <rect class="inner" x="770" y="170" width="180" height="140"/>

  <!-- тераса -->
  <rect class="terr" x="700" y="650" width="250" height="90"/>
  <text class="lbl" x="825" y="700">ТЕРАСА — ЮГ</text>

  <!-- паркинг -->
  <rect class="park" x="975" y="110" width="150" height="115"/>
  <text class="ts" x="1050" y="173">ПАРКИНГ</text>

  <!-- надписи в сградата -->
  <text class="t"  x="330" y="225">БАНЯ</text>
  <text class="t"  x="330" y="245" font-size="11.5" fill="#666666">6,3 m²</text>
  <text class="t"  x="495" y="225">МОКРО / КИЛЕР</text>
  <text class="t"  x="495" y="245" font-size="11.5" fill="#666666">6,3 m²</text>
  <text class="t"  x="610" y="225">КУХНЯ</text>
  <text class="t"  x="610" y="245" font-size="11" fill="#666666">отворена · север/изток</text>
  <text class="t"  x="860" y="225">АНТРЕ</text>
  <text class="t"  x="860" y="245" font-size="11.5" fill="#666666">4,0 m²</text>
  <text class="t"  x="430" y="343" font-size="13">КОРИДОР</text>
  <text class="t"  x="415" y="500">СПАЛНЯ 1</text>
  <text class="t"  x="415" y="520" font-size="11.5" fill="#666666">12,9 m² · юг</text>
  <text class="t"  x="675" y="500">СПАЛНЯ 2</text>
  <text class="t"  x="675" y="520" font-size="11.5" fill="#666666">12,9 m² · юг</text>
  <text class="t"  x="885" y="490">ХОЛ + ТРАПЕЗАРИЯ</text>
  <text class="t"  x="885" y="512" font-size="11.5" fill="#666666">30,8 m² · юг</text>

  <!-- вход от изток -->
  <path class="arr" d="M1143,190 L965,190"/>
  <path d="M965,190 L981,182 L981,198 Z" fill="#3d6b8a"/>
  <text class="ts" x="1052" y="176" fill="#3d6b8a" font-size="12">ВХОД</text>

  <!-- слънце и южна инсолация -->
  <g transform="translate(210,815)">
    <circle class="sun" r="18"/>
    <g class="ray">
      <line x1="0" y1="-26" x2="0" y2="-38"/>
      <line x1="0" y1="26" x2="0" y2="38"/>
      <line x1="-26" y1="0" x2="-38" y2="0"/>
      <line x1="26" y1="0" x2="38" y2="0"/>
      <line x1="-19" y1="-19" x2="-28" y2="-28"/>
      <line x1="19" y1="19" x2="28" y2="28"/>
      <line x1="-19" y1="19" x2="-28" y2="28"/>
      <line x1="19" y1="-19" x2="28" y2="-28"/>
    </g>
  </g>
  <text x="262" y="820" font-size="14" fill="#3d3d3d">СЛЪНЦЕ — ЮГ (основна инсолация)</text>

  <path class="arr" d="M330,745 L330,682" stroke-dasharray="6 5"/>
  <path d="M330,682 L322,698 L338,698 Z" fill="#3d6b8a"/>
  <path class="arr" d="M500,745 L500,682" stroke-dasharray="6 5"/>
  <path d="M500,682 L492,698 L508,698 Z" fill="#3d6b8a"/>
  <path class="arr" d="M640,745 L640,682" stroke-dasharray="6 5"/>
  <path d="M640,682 L632,698 L648,698 Z" fill="#3d6b8a"/>

  <!-- север -->
  <g transform="translate(175,145)">
    <circle r="28" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <path d="M0,-22 L10,17 L0,8 L-10,17 Z" fill="#111111"/>
  </g>
  <text class="t" x="175" y="100" font-size="15" font-weight="bold">С</text>

  <!-- бележки -->
  <text x="575" y="118" font-size="13.5" fill="#3d3d3d" text-anchor="middle">СЕВЕР — баня, мокро помещение, кухня: малки отвори + механична вентилация</text>
  <text x="575" y="138" font-size="12.5" fill="#666666" text-anchor="middle">ЮГ — спални и хол: стандартни прозорци и голяма плъзгаща врата</text>
  <text x="575" y="157" font-size="12.5" fill="#666666" text-anchor="middle">ЗАПАД — минимални отвори (лятно прегряване)</text>

  <text x="1140" y="786" font-size="12" fill="#7d8b6a" text-anchor="end">граница на парцела — по кадастрална скица (не е определено)</text>
</svg>
