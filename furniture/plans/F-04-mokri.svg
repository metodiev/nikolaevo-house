<text class="note" x="350.0" y="3400.0" text-anchor="start">1. Баня: душ 1200 × 900 в северозападния ъгъл, WC до западната стена.</text>
<text class="note" x="350.0" y="3650.0" text-anchor="start">2. Мивка с шкаф 1000 mm срещу вратата; огледало на южната стена.</text>
<text class="note" x="350.0" y="3900.0" text-anchor="start">3. Мокро помещение: пералня и сушилня до прозореца, плот и мивка в източния край.</text>
<text class="note" x="350.0" y="4150.0" text-anchor="start">4. Бойлер 600 × 600 в югоизточния ъгъл; вентилация на високо ниво (пунктир).</text>
<text class="note" x="350.0" y="4400.0" text-anchor="start">5. Антре: гардероб 400 mm и пейка до входа; табло на южната стена до вратата.</text>
