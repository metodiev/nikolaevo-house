<text class="note" x="6950.0" y="9000.0" text-anchor="start">1. Кухня: Г-образен плот 600 mm. Мивка под прозореца, котлони на западния плот.</text>
<text class="note" x="6950.0" y="9250.0" text-anchor="start">2. Хладилник 650 mm в североизточния ъгъл на кухнята.</text>
<text class="note" x="6950.0" y="9500.0" text-anchor="start">3. Трапезария 1400 × 900 с 6 стола — изтеглена на юг, проходът до коридора е свободен.</text>
<text class="note" x="6950.0" y="9750.0" text-anchor="start">4. Диван 2200 mm с облегалка на изток, срещу телевизора на западната преграда.</text>
<text class="note" x="6950.0" y="10000.0" text-anchor="start">5. Северната ивица на хола (y 2570–3560) остава свободна за придвижване.</text>
<text class="note" x="6950.0" y="10250.0" text-anchor="start">6. Пред плъзгащата врата (П3) остава свободна зона ≥ 900 mm.</text>
<text class="note" x="6950.0" y="10500.0" text-anchor="start">7. Горните шкафове (пунктир) са на височина 1400–2200 mm.</text>
