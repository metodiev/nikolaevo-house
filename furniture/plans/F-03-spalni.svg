<text class="note" x="350.0" y="9000.0" text-anchor="start">1. Легло 2000 × 2200 mm в двете спални, табла на вътрешната преграда — без прозорец зад главата.</text>
<text class="note" x="350.0" y="9250.0" text-anchor="start">2. Нощни шкафчета 450 mm от двете страни на леглото.</text>
<text class="note" x="350.0" y="9500.0" text-anchor="start">3. Гардероб с плъзгащи врати: 1600 mm в спалня 1, 1200 mm в спалня 2.</text>
<text class="note" x="350.0" y="9750.0" text-anchor="start">4. Проходът до леглото е 950 mm, пред гардероба — 500 mm.</text>
<text class="note" x="350.0" y="10000.0" text-anchor="start">5. Без скрин — съхранението е изцяло в гардероба.</text>
